name: Deploy to itch.io

on:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.6.3
  EXPORT_NAME: takbo-jusko
  ITCHIO_USERNAME: FvlSky 
  ITCHIO_GAME: takbo-jusko

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:${{ env.GODOT_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Create build directory
        run: mkdir -v -p build/web

      - name: Export for Web
        run: |
          godot --headless -v --export-release "Web" ./build/web/index.html

      - name: Add coi-serviceworker (fixes cross-origin isolation on itch.io)
        run: |
          cd build/web
          wget -q https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js
          sed -i 's/<head>/<head>\n<script src="coi-serviceworker.min.js"><\/script>/' index.html

      - name: Deploy to itch.io via Butler
        uses: josephbmanley/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: ${{ env.ITCHIO_GAME }}
          ITCH_USER: ${{ env.ITCHIO_USERNAME }}
          PACKAGE: build/web